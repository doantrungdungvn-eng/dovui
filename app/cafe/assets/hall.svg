<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8bc7a0"/><stop offset=".48" stop-color="#d9d9a0"/><stop offset="1" stop-color="#e8c99a"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#9b7855"/><stop offset="1" stop-color="#4d382b"/></linearGradient>
 <linearGradient id="awning" x2="0" y2="1"><stop stop-color="#f4e0b5"/><stop offset="1" stop-color="#c78a51"/></linearGradient>
 <linearGradient id="pot" x2="0" y2="1"><stop stop-color="#c97848"/><stop offset="1" stop-color="#713d2a"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff5cb" stop-opacity=".85"/><stop offset="1" stop-color="#fff5cb" stop-opacity="0"/></radialGradient>
 <pattern id="pavers" width="120" height="94" patternUnits="userSpaceOnUse"><path d="M0 0H120V94H0Z M60 0V47H0 M60 47H120 M0 94L60 47" fill="none" stroke="#e2c49a" stroke-opacity=".22" stroke-width="3"/></pattern>
 <g id="leaf"><path d="M0 0C-34 -24 -36 -63 -4 -79C23 -54 24 -22 0 0Z" fill="#477c48"/><path d="M0 0L-4 -68" stroke="#a8c47c" stroke-width="3" fill="none"/></g>
 <g id="plant"><path d="M-28 0L-14 -78 M0 0L4 -108 M24 0L34 -72" stroke="#416a3c" stroke-width="7" fill="none"/><use href="#leaf" transform="translate(-14 -36) rotate(-35) scale(.85)"/><use href="#leaf" transform="translate(3 -57) rotate(12) scale(.95)"/><use href="#leaf" transform="translate(22 -34) rotate(45) scale(.82)"/><use href="#leaf" transform="translate(-23 -13) rotate(-60) scale(.7)"/></g>
 <g id="bulb"><path d="M0 0V30" stroke="#513622" stroke-width="3"/><circle cy="36" r="10" fill="#ffdb86"/><circle cy="36" r="28" fill="#ffdc86" opacity=".13"/></g>
</defs>
<rect width="1080" height="1920" fill="url(#sky)"/>
<circle cx="550" cy="340" r="420" fill="url(#sun)"/>
<!-- distant garden -->
<path d="M0 440Q130 340 270 425T550 400T830 390T1080 425V1060H0Z" fill="#6f9c65"/>
<path d="M0 550Q170 470 320 550T620 525T900 520T1080 550V1120H0Z" fill="#477c50"/>
<!-- leafy canopy -->
<g opacity=".98">
 <circle cx="35" cy="150" r="180" fill="#2f6942"/><circle cx="170" cy="110" r="140" fill="#4d854b"/><circle cx="320" cy="150" r="125" fill="#659657"/>
 <circle cx="1030" cy="150" r="180" fill="#2f6942"/><circle cx="890" cy="95" r="140" fill="#4d854b"/><circle cx="760" cy="160" r="125" fill="#659657"/>
 <circle cx="70" cy="370" r="130" fill="#3b7445"/><circle cx="1010" cy="390" r="150" fill="#3b7445"/>
</g>
<!-- back fence and café pergola -->
<path d="M70 430V1010 M1010 430V1010" stroke="#70452d" stroke-width="20"/>
<path d="M50 450H1030" stroke="#71472e" stroke-width="26"/>
<path d="M65 480H1015" stroke="#e5bd83" stroke-width="8"/>
<g stroke="#80502f" stroke-width="10" opacity=".8"><path d="M100 510V960M190 510V960M280 510V960M800 510V960M890 510V960M980 510V960"/></g>
<!-- café awning above -->
<path d="M180 120L900 120L970 330L110 330Z" fill="#8d4b32" opacity=".25"/>
<path d="M150 90H930L980 275H100Z" fill="url(#awning)" stroke="#8a5738" stroke-width="12"/>
<path d="M150 90H930L946 150H134Z" fill="#7f4d32"/>
<path d="M134 150H946L963 215H117Z" fill="#f1d7a4"/>
<path d="M117 215H963L980 275H100Z" fill="#a95137"/>
<g stroke="#e9c58c" stroke-width="4"><path d="M220 220L235 275M340 220L355 275M460 220L475 275M580 220L595 275M700 220L715 275M820 220L835 275"/></g>
<!-- string lights -->
<path d="M60 365Q540 470 1020 365" fill="none" stroke="#5a3b27" stroke-width="5"/>
<use href="#bulb" x="160" y="390"/><use href="#bulb" x="310" y="421"/><use href="#bulb" x="470" y="440"/><use href="#bulb" x="630" y="440"/><use href="#bulb" x="790" y="421"/><use href="#bulb" x="940" y="390"/>
<!-- garden floor, deliberately empty: tables and guests are rendered by the app -->
<path d="M0 920Q540 820 1080 920V1920H0Z" fill="url(#floor)"/>
<path d="M0 920Q540 820 1080 920V1920H0Z" fill="url(#pavers)" opacity=".85"/>
<!-- stepping path -->
<path d="M430 920L650 920L1080 1920H0Z" fill="#b3936d" opacity=".22"/>
<path d="M0 1060Q540 970 1080 1060" fill="none" stroke="#d9b98a" stroke-opacity=".3" stroke-width="5"/>
<!-- foliage in side borders, keep central seating area clear -->
<g transform="translate(55 1110) scale(1.1)"><use href="#plant"/></g>
<g transform="translate(1000 1140) scale(1.3)"><use href="#plant"/></g>
<g transform="translate(35 1440) scale(1.55)"><use href="#plant"/></g>
<g transform="translate(1040 1490) scale(1.65)"><use href="#plant"/></g>
<g transform="translate(90 1740) scale(1.9)"><use href="#plant"/></g>
<g transform="translate(990 1780) scale(2)"><use href="#plant"/></g>
<!-- terracotta planters -->
<g><path d="M15 1700H130L116 1810Q72 1845 29 1810Z" fill="url(#pot)"/><ellipse cx="72" cy="1700" rx="58" ry="15" fill="#4b3929"/><path d="M935 1740H1060L1040 1850Q998 1882 955 1850Z" fill="url(#pot)"/><ellipse cx="998" cy="1740" rx="62" ry="16" fill="#4b3929"/></g>
<!-- warm vignette -->
<rect width="1080" height="1920" fill="#1b140e" opacity=".08"/>
<rect width="1080" height="1920" fill="none" stroke="#3b281b" stroke-width="24"/>
</svg>